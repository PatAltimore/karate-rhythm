<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0b12" />
  <title>Karate Rhythm — a rhythm-based fighter</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="game">
    <canvas id="screen" width="280" height="192"></canvas>

    <!-- Heads-up display (HTML overlay so text stays crisp at any scale) -->
    <div id="hud" aria-hidden="true">
      <div class="hud-top">
        <div class="score-box">
          <span class="hud-label">Score</span>
          <span id="score">0</span>
        </div>
        <div class="center-box">
          <div class="level-box">
            <span class="hud-label" id="act">Act I</span>
            <span id="level">1</span>
          </div>
        </div>
        <div class="combo-box">
          <span id="combo"></span>
        </div>
      </div>

      <div id="boss-hud" style="display:none">
        <span class="hud-label">Shogun</span>
        <div class="boss-bar"><div id="boss-fill"></div></div>
      </div>

      <div class="strength-wrap">
        <span class="hud-label">Strength</span>
        <div class="strength-bar">
          <div id="strength-fill"></div>
        </div>
      </div>

      <div id="popup-layer"></div>
    </div>

    <!-- Title screen -->
    <div id="title" class="overlay">
      <h1>Karate<span>Rhythm</span></h1>
      <p class="tag">A rhythm-based fighter inspired by Karateka</p>
      <ul class="how">
        <li><b>Click / tap / space bar</b> on the beat to attack.</li>
      </ul>
      <button id="start-btn" class="btn">► Start</button>
      <p class="cheat-hint">Skip to:
        <button class="cheat-btn" data-act="2">ACT II</button>
        <button class="cheat-btn" data-act="3">ACT III</button>
        <button class="cheat-btn" data-act="4">BOSS</button>
      </p>
    </div>

    <!-- Game over screen -->
    <div id="gameover" class="overlay hidden">
      <h2>The End</h2>
      <p class="reached">Reached level <span id="final-level">1</span></p>
      <div class="final">
        <div><span class="hud-label">Score</span><span id="final-score">0</span></div>
        <div><span class="hud-label">Best</span><span id="best-score">0</span></div>
        <div><span class="hud-label">Foes defeated</span><span id="final-kills">0</span></div>
        <div><span class="hud-label">Best combo</span><span id="final-combo">0</span></div>
      </div>
      <button id="restart-btn" class="btn">► Try Again</button>
      <button id="title-btn" class="btn btn-secondary">↩ Title</button>
    </div>

    <!-- Victory screen -->
    <div id="victory" class="overlay hidden">
      <h2 class="vict-title">The Shogun is defeated</h2>
      <p class="reached">The princess is saved</p>
      <div class="final">
        <div><span class="hud-label">Score</span><span id="vict-score">0</span></div>
        <div><span class="hud-label">Best</span><span id="vict-best">0</span></div>
      </div>
      <button id="victory-btn" class="btn">► Play Again</button>
    </div>

    <!-- Story cut-scenes -->
    <div id="cutscene" class="hidden">
      <div id="cutscene-box">
        <p id="cutscene-text"></p>
      </div>
      <button id="cutscene-skip" class="btn cut-skip">SKIP ►</button>
    </div>

    <button id="mute-btn" title="Mute / unmute (M)" aria-label="Mute">♪</button>
  </div>

  <!-- Classic scripts (no bundler needed) loaded in dependency order -->
  <script src="js/audio.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/background.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
